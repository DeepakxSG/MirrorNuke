name: mirrornuke_app
description: Private, one-click screen + stereo audio casting and remote control.
publish_to: 'none'
version: 2.0.3+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.3
  web_socket_channel: ^3.0.1
  ffi: ^2.1.3
  crypto: ^3.0.6
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  launch_at_startup: ^0.3.1
  multicast_dns: ^0.3.2+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
